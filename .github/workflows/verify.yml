name: Verify C_59a Lean 4 Proof & Exact Integer Checker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS

      - name: Install elan and Lean v4.33.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"

      - name: Fetch Mathlib cache and build Lean 4 proof
        run: |
          lake exe cache get
          lake build

      - name: Forbidden-token audit on C59a.lean
        run: |
          python3 - <<'EOF'
          import re, sys

          SOUNDNESS_PATTERN = re.compile(
              r"\b(sorry|admit|axiom|native_decide|ofReduceBool|trustCompiler|"
              r"implemented_by|unsafe|partial|csimp|opaque|macro|notation)\b"
              r"|@\[extern|\blocal\s+instance\b"
          )

          def strip_lean_comments_and_strings(src: str) -> str:
              out = []
              i, n, depth = 0, len(src), 0
              in_str = False
              while i < n:
                  if in_str:
                      if src[i] == "\\" and i + 1 < n:
                          out.append("  ")
                          i += 2
                          continue
                      if src[i] == '"':
                          in_str = False
                      out.append("\n" if src[i] == "\n" else " ")
                      i += 1
                      continue
                  if depth > 0:
                      if src[i:i+2] == "/-":
                          depth += 1
                          out.append("  ")
                          i += 2
                      elif src[i:i+2] == "-/":
                          depth -= 1
                          out.append("  ")
                          i += 2
                      else:
                          out.append("\n" if src[i] == "\n" else " ")
                          i += 1
                      continue
                  if src[i:i+2] == "--":
                      while i < n and src[i] != "\n":
                          out.append(" ")
                          i += 1
                      continue
                  if src[i:i+2] == "/-":
                      depth += 1
                      out.append("  ")
                      i += 2
                      continue
                  if src[i] == '"':
                      in_str = True
                      out.append(" ")
                      i += 1
                      continue
                  out.append(src[i])
                  i += 1
              return "".join(out)

          cleaned = strip_lean_comments_and_strings(open("C59a.lean", encoding="utf-8").read())
          bad = []
          set_opts = []
          for ln, line in enumerate(cleaned.splitlines(), 1):
              for m in SOUNDNESS_PATTERN.finditer(line):
                  bad.append(f"C59a.lean:{ln}: {m.group(0)}: {line.strip()}")
              if re.search(r"\bset_option\b", line):
                  s = line.strip()
                  if s != "set_option maxRecDepth 100000 in":
                      bad.append(f"C59a.lean:{ln}: unexpected set_option: {s}")
                  else:
                      set_opts.append((ln, s))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"[PASS] 0 soundness-affecting tokens; {len(set_opts)} scoped maxRecDepth directives: {set_opts}")
          EOF

      - name: Independent #print axioms and kernel inspection on both headline theorems
        run: |
          lake env lean --stdin <<'EOF'
          import C59a
          import Lean

          #print axioms Optim.BohrRadius.bohrRadius_lt_3028252794909876_div_10pow16
          #print axioms Optim.BohrRadius.bohrRadius_lt_302825279490987594822_div_10pow21

          open Lean in
          #eval show CoreM Unit from do
            let allowed : List Name := [`propext, `Classical.choice, `Quot.sound]
            let thms : List Name := [
              `Optim.BohrRadius.bohrRadius_lt_3028252794909876_div_10pow16,
              `Optim.BohrRadius.bohrRadius_lt_302825279490987594822_div_10pow21
            ]
            let env ← getEnv
            for nm in thms do
              let some (.thmInfo info) := env.find? nm
                | throwError s!"{nm} is not a theorem"
              if info.value.hasSorry then
                throwError s!"{nm} contains sorry in proof term"
              let axs := (← collectAxioms nm).toList
              for ax in axs do
                if !allowed.contains ax then
                  throwError s!"{nm} uses disallowed axiom {ax}"
              IO.println s!"OK THM {nm}: axioms={axs}"
            let defs : List Name := [
              `Optim.BohrRadius.unitBidisc,
              `Optim.BohrRadius.IsSchur,
              `Optim.BohrRadius.HasBidiscCoefficients,
              `Optim.BohrRadius.finiteMajorant,
              `Optim.BohrRadius.IsBohrAdmissible,
              `Optim.BohrRadius.bohrRadius
            ]
            for nm in defs do
              let some (.defnInfo info) := env.find? nm
                | throwError s!"{nm} is not a definition"
              if info.safety != .safe then
                throwError s!"{nm} is not DefinitionSafety.safe"
              IO.println s!"OK DEF {nm}: safe"
            IO.println "C59A_CI_KERNEL_CHECK_PASS"
          EOF

      - name: Independent stdlib Python exact integer verifier
        run: python3 certify_c59a_world_record.py
